<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAVIALIS — The Last River Dragon</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card-bg: #121216;
      --text: #e0e0e0;
      --accent: #d4af37;
      --border: #22222a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    h1 {
      letter-spacing: 4px;
      font-size: 1.8rem;
    }

    .tagline {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 4px;
    }

    .product-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #000;
      border-radius: 2px;
    }

    .product-title {
      font-weight: bold;
      margin: 12px 0 6px 0;
      letter-spacing: 1px;
    }

    .product-price {
      color: var(--accent);
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #1f1f26;
      color: #fff;
      border: 1px solid var(--border);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: var(--accent);
      color: #000;
    }

    /* Admin Panel to Add Products */
    .admin-section {
      background: var(--card-bg);
      border: 1px dashed var(--border);
      padding: 20px;
      margin-top: 40px;
      border-radius: 4px;
    }

    .admin-section h2 {
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: #aaa;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      background: #0a0a0c;
      border: 1px solid var(--border);
      color: #fff;
    }
  </style>
  <!-- Razorpay SDK for Indian Payments -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>GAVIALIS</h1>
        <div class="tagline">SPECIES 001 / CHAMBAL / INDIA</div>
      </div>
      <div>
        <span style="color: var(--accent);">THE LAST RIVER DRAGON</span>
      </div>
    </header>

    <!-- Product Display Area -->
    <h2 style="margin-bottom: 20px; letter-spacing: 2px;">COLLECTION</h2>
    <div class="product-grid" id="productGrid">
      <!-- Products load here dynamically -->
    </div>

    <!-- Admin Section to Add New T-Shirts -->
    <div class="admin-section">
      <h2>+ ADD NEW PRODUCT (ADMIN)</h2>
      <div class="form-group">
        <label>T-Shirt Name / Code</label>
        <input type="text" id="pName" placeholder="e.g. GAVIALIS - CHAMBAL BLACK">
      </div>
      <div class="form-group">
        <label>Price (INR ₹)</label>
        <input type="number" id="pPrice" placeholder="1499">
      </div>
      <div class="form-group">
        <label>Image URL or Uploaded Image Link</label>
        <input type="text" id="pImg" placeholder="Paste image address / URL here">
      </div>
      <button class="btn" onclick="addProduct()">Add Product to Store</button>
    </div>
  </div>

  <script>
    // Initial sample product
    let products = [
      {
        id: 1,
        name: "GAVIALIS / THE LAST RIVER DRAGON",
        price: 1499,
        img: "https://via.placeholder.com/400x500/111/fff?text=GAVIALIS+TEE"
      }
    ];

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${p.img}" alt="${p.name}">
            <div class="product-title">${p.name}</div>
            <div class="product-price">₹${p.price}</div>
            <button class="btn" onclick="buyNow('${p.name}', ${p.price})">BUY NOW (UPI / CARD)</button>
          </div>
        `;
      });
    }

    function addProduct() {
      const name = document.getElementById('pName').value;
      const price = document.getElementById('pPrice').value;
      const img = document.getElementById('pImg').value;

      if (!name || !price) {
        alert('Please enter product name and price');
        return;
      }

      products.push({
        id: Date.now(),
        name: name,
        price: Number(price),
        img: img || 'https://via.placeholder.com/400x500/111/fff?text=GAVIALIS+TEE'
      });

      renderProducts();
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pImg').value = '';
    }

    function buyNow(name, price) {
      // Direct Razorpay Payment trigger
      const options = {
        "key": "YOUR_RAZORPAY_KEY_ID", // Replace with real key when ready
        "amount": price * 100, // Amount in paise
        "currency": "INR",
        "name": "GAVIALIS",
        "description": name,
        "handler": function (response) {
          alert("Payment Successful! Transaction ID: " + response.razorpay_payment_id);
        },
        "prefill": {
          "name": "",
          "email": ""
        },
        "theme": {
          "color": "#0a0a0c"
        }
      };
      const rzp = new Razorpay(options);
      rzp.open();
    }

    // Load initial products on startup
    renderProducts();
  </script>
</body>
</html>
